import com.github.spotbugs.snom.Confidence
import com.github.spotbugs.snom.Effort
import com.github.spotbugs.snom.SpotBugsTask
import org.gradle.testing.jacoco.tasks.JacocoCoverageVerification
import org.gradle.testing.jacoco.tasks.JacocoReport
import org.springframework.boot.gradle.plugin.SpringBootPlugin
import org.springframework.boot.gradle.tasks.run.BootRun

plugins {
    id 'java'
    id 'jacoco'
    id 'com.diffplug.spotless' version '8.9.0'
    id 'com.github.spotbugs' version '6.5.9'
    id 'info.solidsoft.pitest' version '1.19.0'
    id 'org.owasp.dependencycheck' version '12.2.2'
    id 'org.springframework.boot' version '3.5.16'
}

group = 'com.cobre'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

jacoco {
    toolVersion = '0.8.15'
}

spotless {
    java {
        target 'src/*/java/**/*.java'
        importOrder()
        removeUnusedImports()
        palantirJavaFormat()
        formatAnnotations()
        trimTrailingWhitespace()
        endWithNewline()
    }

    format 'gradle', {
        target '*.gradle'
        trimTrailingWhitespace()
        endWithNewline()
    }
}

spotbugs {
    ignoreFailures = false
    effort = Enum.valueOf(Effort, 'MAX')
    reportLevel = Enum.valueOf(Confidence, 'MEDIUM')
    excludeFilter = file('config/spotbugs-exclude.xml')
    runOnCheck = true
}

tasks.named('spotbugsMain').configure { Task genericTask ->
    SpotBugsTask task = genericTask as SpotBugsTask
    def htmlReport = task.reports.maybeCreate('html')
    htmlReport.required = true
    htmlReport.stylesheet = 'fancy-hist.xsl'
    task.reports.maybeCreate('xml').required = false
}

sourceSets {
    integrationTest {
        java.srcDir file('src/integrationTest/java')
        resources.srcDir file('src/integrationTest/resources')
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
}

pitest {
    pitestVersion = '1.22.1'
    junit5PluginVersion = '1.2.3'
    targetClasses = [
        'com.cobre.notifications.domain.model.RetryPolicy',
        'com.cobre.notifications.domain.service.*',
        'com.cobre.notifications.application.service.*',
        'com.cobre.notifications.adapter.in.scheduling.*',
        'com.cobre.notifications.adapter.in.web.security.*',
        'com.cobre.notifications.adapter.out.observability.*',
        'com.cobre.notifications.adapter.out.webhook.*'
    ]
    testSourceSets = [sourceSets.test]
    threads = 4
    outputFormats = ['HTML', 'XML']
    timestampedReports = false
    failWhenNoMutations = true
    mutationThreshold = 70
    testStrengthThreshold = 80
}

dependencyCheck {
    failBuildOnCVSS = 7.0
    failOnError = true
    failBuildOnUnusedSuppressionRule = true
    formats = ['HTML', 'JSON']
    scanConfigurations = ['runtimeClasspath']
    skipTestGroups = false
    suppressionFile = 'config/dependency-check-suppressions.xml'

    nvd.datafeedUrl = 'https://dependency-check.github.io/DependencyCheck_Builder/nvd_cache/nvdcve-{0}.json.gz'

    analyzers.ossIndex.enabled = false
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    implementation platform(SpringBootPlugin.BOM_COORDINATES)
    implementation platform('com.fasterxml.jackson:jackson-bom:2.21.5')
    implementation platform('org.apache.logging.log4j:log4j-bom:2.25.5')
    developmentOnly platform(SpringBootPlugin.BOM_COORDINATES)
    annotationProcessor platform(SpringBootPlugin.BOM_COORDINATES)
    testImplementation platform(SpringBootPlugin.BOM_COORDINATES)

    constraints {
        implementation 'org.apache.tomcat.embed:tomcat-embed-core:10.1.57'
        implementation 'org.apache.tomcat.embed:tomcat-embed-el:10.1.57'
        implementation 'org.apache.tomcat.embed:tomcat-embed-websocket:10.1.57'
    }

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'
    implementation 'org.webjars:swagger-ui:5.32.13'

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    runtimeOnly 'org.postgresql:postgresql:42.7.13'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    integrationTestImplementation 'org.testcontainers:junit-jupiter'
    integrationTestImplementation 'org.testcontainers:postgresql'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.register('bootRunObservability', BootRun) {
    group = 'application'
    description = 'Runs the application with PostgreSQL and the local observability stack.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.cobre.notifications.NotificationPlatformApplication'
    args '--spring.docker.compose.profiles.active=observability',
            '--spring.docker.compose.lifecycle-management=start-only'
}

tasks.register('integrationTest', Test) {
    description = 'Runs tests that exercise external adapters such as PostgreSQL.'
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    shouldRunAfter tasks.named('test')

    def colimaSocket = file("${System.getProperty('user.home')}/.colima/default/docker.sock")
    if (!System.getenv('DOCKER_HOST') && colimaSocket.exists()) {
        environment 'DOCKER_HOST', "unix://${colimaSocket.absolutePath}"
        environment 'TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE', '/var/run/docker.sock'
    }
}

tasks.named('spotbugsTest') {
    enabled = false
}

tasks.named('spotbugsIntegrationTest') {
    enabled = false
}

tasks.named('jacocoTestReport').configure { Task genericTask ->
    JacocoReport task = genericTask as JacocoReport
    task.dependsOn tasks.named('test'), tasks.named('integrationTest')
    task.executionData tasks.named('test').get(), tasks.named('integrationTest').get()

    task.reports {
        xml.required = true
        csv.required = false
        html.required = true
    }
}

tasks.named('jacocoTestCoverageVerification').configure { Task genericTask ->
    JacocoCoverageVerification task = genericTask as JacocoCoverageVerification
    task.dependsOn tasks.named('test'), tasks.named('integrationTest')
    task.executionData tasks.named('test').get(), tasks.named('integrationTest').get()

    task.violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.90
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.70
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('integrationTest'),
            tasks.named('jacocoTestReport'),
            tasks.named('jacocoTestCoverageVerification')
}
