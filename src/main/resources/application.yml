spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: cobre-notification-platform
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 3000
      maximum-pool-size: 10
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

server:
  tomcat:
    mbeanregistry:
      enabled: true

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:true}
    version: 5.32.13
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

notifications:
  delivery:
    http:
      connect-timeout: ${NOTIFICATION_HTTP_CONNECT_TIMEOUT:2s}
      response-timeout: ${NOTIFICATION_HTTP_RESPONSE_TIMEOUT:5s}
    retry:
      maximum-attempts: ${NOTIFICATION_RETRY_MAX_ATTEMPTS:4}
      delays: ${NOTIFICATION_RETRY_DELAYS:1s,5s,30s}
    worker:
      enabled: ${NOTIFICATION_WORKER_ENABLED:false}
      worker-id: ${NOTIFICATION_WORKER_ID:${HOSTNAME:local-worker}}
      batch-size: ${NOTIFICATION_WORKER_BATCH_SIZE:10}
      poll-interval: ${NOTIFICATION_WORKER_POLL_INTERVAL:1s}
      initial-delay: ${NOTIFICATION_WORKER_INITIAL_DELAY:5s}
      lease-duration: ${NOTIFICATION_WORKER_LEASE_DURATION:2m}
  json-import:
    enabled: ${NOTIFICATION_JSON_IMPORT_ENABLED:false}
    location: ${NOTIFICATION_JSON_IMPORT_LOCATION:classpath:imports/notification_events.json}
  subscription-bootstrap:
    enabled: ${NOTIFICATION_SUBSCRIPTION_BOOTSTRAP_ENABLED:false}
    subscriptions:
      - subscription-id: CLIENT001_DEFAULT
        client-id: CLIENT001
        endpoint-url: ${NOTIFICATION_SUBSCRIPTION_BOOTSTRAP_ENDPOINT_URL:}
        event-types:
          - credit_card_payment
          - credit_deposit
          - debit_card_withdrawal
          - debit_subscription
      - subscription-id: CLIENT002_DEFAULT
        client-id: CLIENT002
        endpoint-url: ${NOTIFICATION_SUBSCRIPTION_BOOTSTRAP_ENDPOINT_URL:}
        event-types:
          - credit_transfer
          - debit_automatic_payment
          - debit_purchase
      - subscription-id: CLIENT003_DEFAULT
        client-id: CLIENT003
        endpoint-url: ${NOTIFICATION_SUBSCRIPTION_BOOTSTRAP_ENDPOINT_URL:}
        event-types:
          - credit_cashback
          - credit_refund
          - debit_transfer
  security:
    monitoring:
      token: ${NOTIFICATION_MONITORING_TOKEN:}
    clients:
      - client-id: CLIENT001
        token: ${NOTIFICATION_CLIENT_001_TOKEN:}
      - client-id: CLIENT002
        token: ${NOTIFICATION_CLIENT_002_TOKEN:}
      - client-id: CLIENT003
        token: ${NOTIFICATION_CLIENT_003_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        cobre.notifications.delivery.attempt.duration: true
        cobre.notifications.worker.batch.duration: true
        http.server.requests: true
