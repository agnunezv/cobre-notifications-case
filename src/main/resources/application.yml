spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: cobre-notification-platform
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 3000
      maximum-pool-size: 10
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

notifications:
  json-import:
    enabled: ${NOTIFICATION_JSON_IMPORT_ENABLED:false}
    location: classpath:imports/notification_events.json

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
