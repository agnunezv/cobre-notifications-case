spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: cobre-notification-platform
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 3000
      maximum-pool-size: 10
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

notifications:
  delivery:
    http:
      connect-timeout: ${NOTIFICATION_HTTP_CONNECT_TIMEOUT:2s}
      response-timeout: ${NOTIFICATION_HTTP_RESPONSE_TIMEOUT:5s}
    retry:
      maximum-attempts: ${NOTIFICATION_RETRY_MAX_ATTEMPTS:4}
      delays: ${NOTIFICATION_RETRY_DELAYS:1s,5s,30s}
    worker:
      enabled: ${NOTIFICATION_WORKER_ENABLED:false}
      worker-id: ${NOTIFICATION_WORKER_ID:${HOSTNAME:local-worker}}
      batch-size: ${NOTIFICATION_WORKER_BATCH_SIZE:10}
      poll-interval: ${NOTIFICATION_WORKER_POLL_INTERVAL:1s}
      initial-delay: ${NOTIFICATION_WORKER_INITIAL_DELAY:5s}
      lease-duration: ${NOTIFICATION_WORKER_LEASE_DURATION:2m}
  json-import:
    enabled: ${NOTIFICATION_JSON_IMPORT_ENABLED:false}
    location: classpath:imports/notification_events.json
  subscription-bootstrap:
    enabled: ${NOTIFICATION_SUBSCRIPTION_BOOTSTRAP_ENABLED:false}
    subscription-id: ${NOTIFICATION_SUBSCRIPTION_BOOTSTRAP_ID:}
    client-id: ${NOTIFICATION_SUBSCRIPTION_BOOTSTRAP_CLIENT_ID:}
    endpoint-url: ${NOTIFICATION_SUBSCRIPTION_BOOTSTRAP_ENDPOINT_URL:}
    event-types: ${NOTIFICATION_SUBSCRIPTION_BOOTSTRAP_EVENT_TYPES:}
  security:
    clients:
      - client-id: CLIENT001
        token: ${NOTIFICATION_CLIENT_001_TOKEN:}
      - client-id: CLIENT002
        token: ${NOTIFICATION_CLIENT_002_TOKEN:}
      - client-id: CLIENT003
        token: ${NOTIFICATION_CLIENT_003_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
