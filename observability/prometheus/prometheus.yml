global:
  scrape_interval: 5s
  scrape_timeout: 3s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: cobre-notification-platform
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials_file: /run/secrets/cobre_metrics_token
    static_configs:
      - targets:
          - host.docker.internal:8080
        labels:
          environment: local
          service: cobre-notification-platform

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
        labels:
          environment: local
          service: prometheus

  - job_name: grafana
    static_configs:
      - targets:
          - grafana:3000
        labels:
          environment: local
          service: grafana

  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093
        labels:
          environment: local
          service: alertmanager
