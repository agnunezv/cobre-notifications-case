global:
  resolve_timeout: 5m

route:
  receiver: macos-native-notifications
  group_by:
    - alertname
    - client_id
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 30m

receivers:
  - name: macos-native-notifications
    webhook_configs:
      - url: http://host.docker.internal:19093/alerts
        send_resolved: true
        max_alerts: 20
        timeout: 5s
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/cobre_alert_webhook_token
